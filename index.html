<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Plan My Educator Cover Letter</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Educator Career Resources</p>
        <h1>Plan My Cover Letter</h1>
        <p class="lede">Connect what the school wants with what you’ve done — and build a clear plan for what to say.</p>
      </div>
      <button class="ghost" id="restartBtn" type="button">Start over</button>
    </header>

    <section class="progress-wrap" aria-label="Progress">
      <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
      <p id="progressText" class="progress-text">Step 1 of 6</p>
    </section>

    <section id="app" class="card" aria-live="polite"></section>
  </main>

  <template id="step1">
    <div class="step">
      <p class="step-label">Step 1</p>
      <h2>What are you applying for?</h2>
      <p class="hint">If you’ve already researched a school or worked with this job posting, we’ll look for that work first.</p>

      <div id="savedApplicationArea"></div>

      <div class="grid two">
        <label>Position title<input id="position" type="text" placeholder="4th Grade Teacher" /></label>
        <label>School<input id="school" type="text" placeholder="Lincoln Elementary" /></label>
      </div>
      <label>District<input id="district" type="text" placeholder="Iowa City Community School District" /></label>
      <label>Paste the job description or the most important parts
        <textarea id="jobDescription" rows="10" placeholder="Paste the posting here..."></textarea>
      </label>
      <div class="actions"><button class="primary" id="analyzeJob">Find what matters</button></div>
    </div>
  </template>

  <template id="step2">
    <div class="step">
      <p class="step-label">Step 2</p>
      <h2>What should your letter emphasize?</h2>
      <p class="hint">Choose 2–3 things you can support with a real example. You do not need to cover everything.</p>
      <div id="priorityList" class="choice-list"></div>
      <div class="actions split"><button class="secondary" data-back>Back</button><button class="primary" id="savePriorities">Continue</button></div>
    </div>
  </template>

  <template id="step3">
    <div class="step">
      <p class="step-label">Step 3</p>
      <h2>What can you show them?</h2>
      <p class="hint">Use work you’ve already done when it fits. Otherwise, add a quick example.</p>
      <div id="evidenceArea"></div>
      <div class="actions split"><button class="secondary" data-back>Back</button><button class="primary" id="saveEvidence">Continue</button></div>
    </div>
  </template>

  <template id="step4">
    <div class="step">
      <p class="step-label">Step 4</p>
      <h2>Why this school?</h2>
      <div id="researchArea"></div>
      <div class="actions split"><button class="secondary" data-back>Back</button><button class="primary" id="saveResearch">Build my plan</button></div>
    </div>
  </template>

  <template id="step5">
    <div class="step">
      <p class="step-label">Step 5</p>
      <h2>Your cover letter plan</h2>
      <p class="hint">This is your case for this job — not a script you have to follow word-for-word.</p>
      <div id="planArea"></div>
      <div class="actions split"><button class="secondary" data-back>Back</button><button class="primary" id="toDraft">Help me write it</button></div>
    </div>
  </template>

  <template id="step6">
    <div class="step">
      <p class="step-label">Step 6</p>
      <h2>Write from your plan</h2>
      <p class="hint">Choose the level of help you want. Keep everything accurate and in your own voice.</p>
      <div id="draftArea"></div>
      <div class="actions split"><button class="secondary" data-back>Back</button><button class="primary" id="copyPlan">Copy my plan</button></div>
      <p id="copyStatus" class="status" role="status"></p>
    </div>
  </template>

  <script src="script.js"></script>
</body>
</html>
